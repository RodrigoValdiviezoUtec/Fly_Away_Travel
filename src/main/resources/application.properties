spring.application.name=fly_away
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:flyawaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=flyaway_super_secret_key_must_be_at_least_32_chars_long
jwt.expiration-ms=86400000

# File storage for booking emails
booking.email.directory=target